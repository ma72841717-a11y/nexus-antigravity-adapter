name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install, typecheck, test (if project present)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run typecheck --if-present
            npm run build --if-present
            npm test --if-present
          else
            echo "No package.json yet — bootstrap-only commit, nothing to build."
          fi
